name: V3 real IME compatibility
on:
  workflow_dispatch:
    inputs:
      test_os:
        description: Disposable Windows image to validate
        type: choice
        options: [windows-11-arm, windows-2025]
        default: windows-11-arm
# Windows capability retrieval is environment-dependent. Run this explicitly
# so ordinary fixture edits do not repeat a stalled OS package download.
permissions:
  contents: read
jobs:
  japanese-ime:
    runs-on: ${{ inputs.test_os }}
    timeout-minutes: 40
    env:
      GUARD_TEST_IME_CLSID: 03B5835F-F03C-411B-9CE2-AA23E1171E36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Provision Japanese input on this disposable VM only
        shell: powershell
        run: ./tools/Install-GuardTestIme.ps1
      - name: Validate real composition using only the disposable VM's fixture
        shell: pwsh
        timeout-minutes: 3
        run: |
          ./tools/Initialize-GuardTestDesktop.ps1
          dotnet build tests/GuardImeTests/GuardImeTests.csproj -c Release -p:Edition=Guard --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/GuardImeTests/bin/Guard/Release/net8.0-windows/GuardImeTests.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve capability installation diagnostics
        if: always()
        shell: pwsh
        run: |
          foreach ($entry in @(@('DISM/dism.log', 'dism'), @('CBS/CBS.log', 'cbs'))) {
            $log = Join-Path "$env:WINDIR/Logs" $entry[0]
            if (Test-Path -LiteralPath $log) {
              Get-Content -LiteralPath $log -Tail 160 | Set-Content -LiteralPath "$env:RUNNER_TEMP/v3-ime-$($entry[1]).txt"
            }
          }
      - name: Save provisioning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-real-ime-validation-${{ inputs.test_os }}
          path: |
            ${{ runner.temp }}/v3-ime-*.txt
            ${{ runner.temp }}/v3-ime-*.png
          retention-days: 7
          if-no-files-found: error

name: V3 real IME compatibility
on:
  workflow_dispatch:
    inputs:
      test_os:
        description: Disposable Windows image to validate
        type: choice
        options: [windows-11-arm, windows-2025]
        default: windows-11-arm
      repair_window:
        description: Keep a failed prepared VM for up to 10 minutes to validate new V3 revisions
        type: choice
        options: ['0', '10']
        default: '0'
# Windows capability retrieval is environment-dependent. Run this explicitly
# so ordinary fixture edits do not repeat a stalled OS package download.
permissions:
  contents: read
jobs:
  japanese-ime:
    runs-on: ${{ inputs.test_os }}
    timeout-minutes: 50
    env:
      GUARD_TEST_IME_CLSID: 03B5835F-F03C-411B-9CE2-AA23E1171E36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check disposable desktop readiness before downloading input packages
        shell: pwsh
        timeout-minutes: 5
        run: |
          ./tools/Initialize-GuardTestDesktop.ps1 -RefreshShell
          dotnet build tests/GuardImeTests/GuardImeTests.csproj -c Release -p:Edition=Guard --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/GuardImeTests/bin/Guard/Release/net8.0-windows/GuardImeTests.dll --check-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision Japanese input on this disposable VM only
        id: provision
        shell: powershell
        run: ./tools/Install-GuardTestIme.ps1
      - name: Validate ordinary browser input independently of the fallback fixture
        id: browser
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 3
        run: |
          ./tools/Initialize-GuardTestDesktop.ps1
          dotnet tests/GuardImeTests/bin/Guard/Release/net8.0-windows/GuardImeTests.dll --browser-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate real composition using only the disposable VM's fixture
        id: fallback
        continue-on-error: true
        if: always() && steps.provision.conclusion == 'success'
        shell: pwsh
        timeout-minutes: 3
        run: |
          ./tools/Initialize-GuardTestDesktop.ps1
          dotnet tests/GuardImeTests/bin/Guard/Release/net8.0-windows/GuardImeTests.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve capability installation diagnostics
        if: always()
        shell: pwsh
        run: |
          foreach ($entry in @(@('DISM/dism.log', 'dism'), @('CBS/CBS.log', 'cbs'))) {
            $log = Join-Path "$env:WINDIR/Logs" $entry[0]
            if (Test-Path -LiteralPath $log) {
              Get-Content -LiteralPath $log -Tail 160 | Set-Content -LiteralPath "$env:RUNNER_TEMP/v3-ime-$($entry[1]).txt"
            }
          }
      - name: Save provisioning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-real-ime-validation-${{ inputs.test_os }}
          path: |
            ${{ runner.temp }}/v3-ime-*.txt
            ${{ runner.temp }}/v3-ime-*.png
          retention-days: 7
          if-no-files-found: error
      - name: Validate an explicitly requested repair on the same disposable VM
        id: repair
        if: always() && steps.provision.outcome == 'success' && inputs.repair_window == '10' && (steps.browser.outcome != 'success' || steps.fallback.outcome != 'success')
        timeout-minutes: 15
        shell: pwsh
        run: ./tools/Test-GuardPreparedVmRevision.ps1 -Minutes 10
      - name: Preserve each repair revision separately
        if: always() && steps.repair.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: v3-real-ime-repairs-${{ inputs.test_os }}
          path: ${{ runner.temp }}/v3-repairs/**
          retention-days: 7
          if-no-files-found: warn
      - name: Require actual passing input and fallback tests
        if: always()
        shell: pwsh
        env:
          INITIAL_BROWSER: ${{ steps.browser.outcome }}
          INITIAL_FALLBACK: ${{ steps.fallback.outcome }}
          REPAIR_PASSED: ${{ steps.repair.outputs.passed }}
          REPAIR_REVISION: ${{ steps.repair.outputs.revision }}
        run: |
          if ($env:INITIAL_BROWSER -eq 'success' -and $env:INITIAL_FALLBACK -eq 'success') { exit 0 }
          if ($env:REPAIR_PASSED -eq 'true') { Write-Output "Passing repair revision: $env:REPAIR_REVISION"; exit 0 }
          throw 'Real IME validation did not pass. See separately retained initial and repair evidence.'

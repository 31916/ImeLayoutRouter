name: Build and regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build -c Release --warnaserror
      - run: dotnet run --project tests/RoutingTests.csproj -c Release
      - run: dotnet run --project tests/UiSmoke/UiSmoke.csproj -c Release
      - run: dotnet build tests/WindowsSmoke/WindowsSmoke.csproj -c Release --warnaserror
      - run: dotnet publish -c Release -r win-x64 --self-contained true --warnaserror
      - name: Package installer and portable preview
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/ImeLayoutRouter.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path bin/Release/net8.0-windows/win-x64/publish/* -DestinationPath ImeLayoutRouter-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ImeLayoutRouter-preview-win-x64
          path: |
            ImeLayoutRouter-win-x64.zip
            installer/output/ImeLayoutRouter-Setup.exe

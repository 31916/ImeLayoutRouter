name: Build and regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        edition: [Simple, Full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build -c Release -p:Edition=${{ matrix.edition }} --warnaserror
      - if: matrix.edition == 'Full'
        run: |
          dotnet build tests/RoutingTests.csproj -c Release -p:Edition=Full --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/bin/Full/Release/net8.0-windows/RoutingTests.dll
      - run: |
          dotnet build tests/UiSmoke/UiSmoke.csproj -c Release -p:Edition=${{ matrix.edition }} --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/UiSmoke/bin/${{ matrix.edition }}/Release/net8.0-windows/UiSmoke.dll
      - run: dotnet build tests/WindowsSmoke/WindowsSmoke.csproj -c Release -p:Edition=${{ matrix.edition }} --warnaserror
      - run: dotnet publish -c Release -p:Edition=${{ matrix.edition }} -r win-x64 --self-contained true --warnaserror
      - name: Package installer and portable application
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DEdition=${{ matrix.edition }} installer/ImeLayoutRouter.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path bin/${{ matrix.edition }}/Release/net8.0-windows/win-x64/publish/* -DestinationPath ImeLayoutRouter-${{ matrix.edition }}-win-x64.zip
      - name: Check installer lifecycle
        shell: pwsh
        run: |
          $installer = (Get-ChildItem installer/output/*-Setup.exe).FullName
          ./tools/Test-Installer.ps1 -Installer $installer -Edition '${{ matrix.edition }}' -TestRoot "$env:RUNNER_TEMP/ime-installer-test"
      - uses: actions/upload-artifact@v4
        with:
          name: ImeLayoutRouter-${{ matrix.edition }}-installer-win-x64
          path: installer/output/ImeLayoutRouter-*-Setup.exe
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ImeLayoutRouter-${{ matrix.edition }}-portable-win-x64
          path: ImeLayoutRouter-${{ matrix.edition }}-win-x64.zip
          if-no-files-found: error
          compression-level: 0

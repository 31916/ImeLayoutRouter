name: V3 development checks
on:
  push:
    branches: [V3]
  workflow_dispatch:
    inputs:
      test_os:
        description: Disposable Windows environment for the packaged x64 installer
        type: choice
        options: [windows-latest, windows-11-arm]
        default: windows-latest
      package:
        description: Retain the validated V3 installer after the release gates pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  guard:
    runs-on: ${{ inputs.test_os || 'windows-latest' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build V3 and regression checks
        shell: pwsh
        run: |
          dotnet build -c Release -p:Edition=Guard --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/GuardTests/GuardTests.csproj -c Release -p:Edition=Guard --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/GuardTests/bin/Guard/Release/net8.0-windows/GuardTests.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native API and recovery checks on a non-displayed desktop
        shell: pwsh
        run: |
          ./tools/Test-GuardDesktop.ps1 -Assembly "$PWD/tests/GuardTests/bin/Guard/Release/net8.0-windows/GuardTests.dll" -OutputPath "$env:RUNNER_TEMP/v3-native-checks.txt"
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-development-validation
          path: |
            ${{ runner.temp }}/v3-native-checks.txt
            ${{ runner.temp }}/v3-settings-*.png
          if-no-files-found: warn
      - name: Build and validate the development installer (not published)
        shell: pwsh
        run: |
          dotnet publish -c Release -p:Edition=Guard -r win-x64 --self-contained true --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/V3.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/Test-GuardInstaller.ps1 -Installer (Get-ChildItem installer/output-v3/*-Setup.exe).FullName
      - name: Checksum the exact validated installer
        if: github.event_name == 'workflow_dispatch' && inputs.package
        shell: pwsh
        run: |
          $taskInstaller = Get-ChildItem installer/output-v3/*-Setup.exe
          if (@($taskInstaller).Count -ne 1 -or $taskInstaller.Name -ne 'ImeLayoutRouter-3.0.0-Setup.exe') {
            throw 'Only the completed V3 version may be retained as an installer.'
          }
          $taskHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $taskInstaller.FullName).Hash.ToLowerInvariant()
          "$taskHash  $($taskInstaller.Name)" | Set-Content installer/output-v3/SHA256SUMS.txt -Encoding ascii
      - name: Retain the validated installer and checksum
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: IMELayoutRouter-V3-validated-installer
          path: |
            installer/output-v3/ImeLayoutRouter-3.0.0-Setup.exe
            installer/output-v3/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error

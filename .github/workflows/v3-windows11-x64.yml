name: V3 isolated Windows 11 x64
on:
  workflow_dispatch:
    inputs:
      timers:
        description: Isolated VM timer path for Windows S3 compatibility
        type: choice
        options: [direct, hardware]
        default: direct
# A full OS install is expensive. Dispatch explicitly; in-flight prepared VMs
# can validate corrected V3 revisions without starting another OS installation.
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - shell: pwsh
        run: |
          dotnet publish tests/GuardImeTests/GuardImeTests.csproj -c Release -p:Edition=Guard -r win-x64 --self-contained true -o artifacts/vm/ime --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tests/GuardTests/GuardTests.csproj -c Release -p:Edition=Guard -r win-x64 --self-contained true -o artifacts/vm/native --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item tools/guard-vm/guest.ps1 artifacts/vm/
          Copy-Item tools/Initialize-GuardTestDesktop.ps1 artifacts/vm/
          git rev-parse HEAD | Set-Content artifacts/vm/revision.txt
      - name: Verify the official browser before transferring it to the guest
        shell: pwsh
        timeout-minutes: 5
        run: |
          $taskBrowser = 'artifacts/vm/chrome.msi'
          Invoke-WebRequest 'https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi' -OutFile $taskBrowser -TimeoutSec 180
          $taskSignature = Get-AuthenticodeSignature -LiteralPath $taskBrowser
          if ($taskSignature.Status -ne 'Valid' -or $taskSignature.SignerCertificate.Subject -notmatch 'O=Google LLC') {
            throw 'A valid official Google signature is required before the browser enters the guest.'
          }
          (Get-FileHash -Algorithm SHA256 -LiteralPath $taskBrowser).Hash.ToLowerInvariant() | Set-Content artifacts/vm/chrome.sha256 -Encoding ascii
          "Authenticode: $($taskSignature.Status); publisher: $($taskSignature.SignerCertificate.Subject)" | Set-Content artifacts/vm/browser-signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v3-vm-test-bundle
          path: artifacts/vm/
          retention-days: 1
  windows11:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v3-vm-test-bundle
          path: artifacts/vm
      - name: Prepare disposable nested virtualization tools
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
          test -c /dev/kvm
          df -h "$RUNNER_TEMP"
          # The Azure image mirror can stall partway through a package. Keep
          # signature validation, use Ubuntu's own HTTPS mirror and bound waits.
          # Hosted images use mirror+file: indirection in ubuntu.sources.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends qemu-system-x86 qemu-system-modules-spice qemu-system-gui qemu-utils ovmf swtpm genisoimage python3-pil acl tesseract-ocr tesseract-ocr-jpn
          # QEMU prints valid option help with exit code 1. Validate its actual
          # capability output rather than mistaking that documented usage exit
          # for a missing module (an unsupported option also exits nonzero).
          qemu-system-x86_64 -spice help > "$RUNNER_TEMP/v3-spice-help.txt" 2>&1 || test "$?" -eq 1
          grep -Fx 'spice options:' "$RUNNER_TEMP/v3-spice-help.txt"
          grep -F 'unix=<bool (on/off)>' "$RUNNER_TEMP/v3-spice-help.txt"
          qemu-system-x86_64 -device help | grep -F qxl
          sudo setfacl -m u:"$USER":rw /dev/kvm
      - name: Boot official Windows 11 evaluation and validate actual input
        timeout-minutes: 75
        shell: bash
        env:
          GUARD_VM_TIMERS: ${{ inputs.timers }}
        run: python3 tools/guard-vm/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-windows11-x64-evidence
          path: artifacts/vm-evidence/
          retention-days: 7
          if-no-files-found: warn

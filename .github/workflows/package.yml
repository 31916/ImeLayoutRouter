name: Build distribution packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    strategy:
      matrix:
        edition: [Simple, Full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: |
          dotnet build tests/RoutingTests.csproj -c Release -p:Edition=Full --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/bin/Full/Release/net8.0-windows/RoutingTests.dll
      - run: |
          dotnet build tests/UiSmoke/UiSmoke.csproj -c Release -p:Edition=${{ matrix.edition }} --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/UiSmoke/bin/${{ matrix.edition }}/Release/net8.0-windows/UiSmoke.dll
      - run: dotnet publish -c Release -p:Edition=${{ matrix.edition }} -r win-x64 --self-contained true --warnaserror
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DEdition=${{ matrix.edition }} installer/ImeLayoutRouter.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive portable application
        shell: pwsh
        run: Compress-Archive -Path bin/${{ matrix.edition }}/Release/net8.0-windows/win-x64/publish/* -DestinationPath ImeLayoutRouter-${{ matrix.edition }}-win-x64.zip
      - name: Check installer lifecycle
        shell: pwsh
        run: |
          $installer = (Get-ChildItem installer/output/*-Setup.exe).FullName
          $previousName = if ('${{ matrix.edition }}' -eq 'Simple') { 'ImeLayoutRouter-V1-1.1.0-Setup.exe' } else { 'ImeLayoutRouter-V2-2.0.0-Setup.exe' }
          $previous = Join-Path $env:RUNNER_TEMP $previousName
          Invoke-WebRequest "https://31916.ch/IMELayoutRouter/downloads/$previousName" -OutFile $previous
          $expectedHash = if ('${{ matrix.edition }}' -eq 'Simple') { '64f48a8db7ed0c5da1f68b0ee772add861463e14d31ed3af9851f548ce73b22e' } else { '510616cb7a1be937ea4b546a99cfe8790295d67115519637539eb91c1e2ac088' }
          if ((Get-FileHash $previous -Algorithm SHA256).Hash -ne $expectedHash) { throw 'Previous installer checksum mismatch.' }
          ./tools/Test-Installer.ps1 -Installer $installer -Edition '${{ matrix.edition }}' -TestRoot "$env:RUNNER_TEMP/ime-installer-test" -PreviousInstaller $previous
      - uses: actions/upload-artifact@v4
        with:
          name: ImeLayoutRouter-${{ matrix.edition }}-installer-win-x64
          path: installer/output/ImeLayoutRouter-*-Setup.exe
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ImeLayoutRouter-${{ matrix.edition }}-portable-win-x64
          path: ImeLayoutRouter-${{ matrix.edition }}-win-x64.zip
          if-no-files-found: error
          compression-level: 0

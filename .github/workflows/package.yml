name: Build preview packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    strategy:
      matrix:
        edition: [Simple, Full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/RoutingTests.csproj -c Release -p:Edition=Full
      - run: dotnet publish -c Release -p:Edition=${{ matrix.edition }} -r win-x64 --self-contained true --warnaserror
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DEdition=${{ matrix.edition }} installer/ImeLayoutRouter.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive portable application
        shell: pwsh
        run: Compress-Archive -Path bin/${{ matrix.edition }}/Release/net8.0-windows/win-x64/publish/* -DestinationPath ImeLayoutRouter-${{ matrix.edition }}-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ImeLayoutRouter-${{ matrix.edition }}-development-win-x64
          path: |
            ImeLayoutRouter-${{ matrix.edition }}-win-x64.zip
            installer/output/ImeLayoutRouter-*-Setup.exe

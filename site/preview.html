<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>IME Layout Router — 配色を比べる</title>
  <link rel="stylesheet" href="preview.css">
  <script src="preview.js" defer></script>
</head>
<body>
  <div class="review">
    <h1>配布サイトの配色案</h1>
    <div class="choices" role="group" aria-label="配色を選ぶ">
      <button type="button" data-palette="navy" aria-pressed="false">A. 白と紺</button>
      <button type="button" data-palette="forest" aria-pressed="true">B. 生成りと深緑（採用）</button>
      <button type="button" data-palette="wine" aria-pressed="false">C. 薄い灰色とえんじ</button>
    </div>
    <p class="hint">同じ内容で色だけを比較できます。下の配布状況は準備中です。正式サイトには、この配色選択欄は表示しません。</p>
  </div>
  <iframe src="index.html" title="配布サイトのデザイン案"></iframe>
</body>
</html>

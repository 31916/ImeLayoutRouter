<!doctype html>
<html lang="en"><meta charset="utf-8"><title>IME Layout Router local input test</title>
<style>body{font:20px system-ui;max-width:800px;margin:32px auto}label{display:block;margin:22px 0}input,textarea{display:block;font:24px system-ui;width:95%;padding:8px}small{font-size:16px}</style>
<h1>IME Layout Router — local input test</h1>
<p>This page never submits, stores or sends the text. Use synthetic input only.</p>
<label>Normal text<input id="normal" type="text" autocomplete="off"></label>
<label>Email<input id="email" type="email" autocomplete="off"></label>
<label>URL<input id="url" type="url" autocomplete="off"></label>
<label>Telephone<input id="tel" type="tel" autocomplete="off"></label>
<label>Number<input id="number" type="number" autocomplete="off"></label>
<label>Password (dummy only)<input id="password" type="password" autocomplete="off"></label>
<label>Multiline normal text<textarea id="multi"></textarea></label>
</html>
